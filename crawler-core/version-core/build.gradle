plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = 'eu.osmosis'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Declared here (not inherited from a parent) so version-core resolves its own dependencies when
// built as a git submodule inside any consuming service.
repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.4"
    }
}

dependencies {
    // Every consumer is a Spring Boot web service and already has these; `api` keeps the
    // one-line-in-settings.gradle wiring working for a service that has nothing else.
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
