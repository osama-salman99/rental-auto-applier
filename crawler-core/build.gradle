import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = 'eu.osmosis'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Declared here (not inherited from a parent) so crawler-core resolves its own
// dependencies when built as a submodule inside any consuming crawler.
repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.4"
    }
}

dependencies {
    // The shared SSO login wall, vendored as a git submodule under auth-core/. `api` so a crawler
    // keeps seeing SsoCookie and friends on its own compile classpath, exactly as when the wall
    // lived in this module. auth-core also brings spring-boot-starter-security transitively.
    api project(':auth-core')

    // The /version endpoint, vendored the same way under version-core/. `api` because the crawler
    // frontends compare it against the version baked into app.js, and it used to be a class in
    // this module.
    api project(':version-core')

    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-thymeleaf'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Bake the build version into the frontend and the /version resource. The
// consuming crawler passes -PosmosisVersion=v<run> in CI; local builds get 'dev'.
// The same value lands in the cacheable app.js (baked) and in osmosis-version
// (read live by VersionController) so a stale cached tab can be detected.
processResources {
    def osmosisVersion = (project.findProperty('osmosisVersion') ?: 'dev').toString()
    inputs.property('osmosisVersion', osmosisVersion)
    filesMatching(['static/app.js', 'osmosis-version']) {
        filter(ReplaceTokens, tokens: [OSMOSIS_VERSION: osmosisVersion])
    }
}

test {
    useJUnitPlatform()
}
