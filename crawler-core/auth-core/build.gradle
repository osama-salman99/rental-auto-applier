plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = 'eu.osmosis'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Declared here (not inherited from a parent) so auth-core resolves its own dependencies when
// built as a git submodule inside any consuming service.
repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.4"
    }
}

dependencies {
    // `api`, not `implementation`: a consumer writing its own controllers needs these on its own
    // compile classpath, and every consumer of auth-core is a Spring Boot web service.
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-security'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // For csrf() in the logout tests: logout is a POST, and the wall keeps CSRF on.
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
