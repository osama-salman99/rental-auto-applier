<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- One home, and the reason it is or isn't being applied for. Built on roofz's listing-card so
         all three consoles read the same. Three lines: address, the numbers, the verdict. The score
         sits in the corner as a pill — worth a glance, not a read.

         The link goes to the tenant portal rather than the public site: that is where the request
         actually lives, so it is where the user can check our work.

         In its own file so it is never rendered on its own with an unbound parameter. -->
    <article th:fragment="listingCard(v)" class="rz-card listing-card" th:classappend="${v.kind}">
      <div class="lc-head">
        <a class="lc-title" target="_blank" rel="noopener"
           th:href="'https://hurenbij.vesteda.com/object/' + ${v.listing.portalHash} + '/'"
           th:text="${v.listing.title}">Address</a>
        <span class="lc-score"
              th:if="${v.kind == 'in-draw' or v.kind == 'queued'}"
              th:text="${v.score}"
              th:title="${v.why}">0</span>
      </div>

      <div class="lc-sub">
        <!-- The portal's rent, not the public API's: it is the figure Vesteda computes its income
             requirement from, and the two can disagree by hundreds of euros. -->
        <span class="price" th:if="${v.rent != null}" th:text="'€' + ${v.rent}"></span>
        <span th:if="${v.listing.livingArea != null}" th:text="${v.listing.livingArea} + ' m²'"></span>
        <span th:if="${v.listing.bedrooms != null}"
              th:text="${v.listing.bedrooms} + (${v.listing.bedrooms} == 1 ? ' bed' : ' beds')"></span>
        <span th:if="${v.dwellingType != null}" th:text="${v.dwellingType}">Appartement</span>
        <span class="lc-match" th:if="${v.fresh}">JUST LISTED</span>
      </div>

      <!-- Who the home is reserved for first. A general applicant is out-queued on these; the score
           already reflects it, and the chips say why the number is what it is. -->
      <div class="lc-restrict" th:if="${not #lists.isEmpty(v.restrictions)}">
        <span class="rchip" th:each="rr : ${v.restrictions}" th:text="${rr}">Key professions</span>
      </div>

      <!-- Detail-page facts, folded in by the enrichment pass. Absent until it has run. -->
      <div class="lc-extra"
           th:if="${v.serviceCosts != null or v.availableFrom != null or v.energyLabel != null}">
        <span th:if="${v.serviceCosts != null}" th:text="'+€' + ${v.serviceCosts} + '/mo service'">+€85/mo service</span>
        <span th:if="${v.availabilityLabel != null}" th:text="${v.availabilityLabel}">Available 13 augustus 2026</span>
        <span class="elabel" th:if="${v.energyLabel != null}" th:text="'Energy ' + ${v.energyLabel}">Energy A++</span>
      </div>

      <p class="lc-why" th:text="${v.verdict}">Why</p>

      <!-- How long we've known about it. Not decoration: a home fills up as it ages, and the portal
           will not admit a home is full until you have already spent a slot finding out — so its age
           is most of why it scores what it scores. app.js turns this into "3 hours ago" in the
           reader's own timezone. -->
      <div class="lc-foot">
        <span>
          <th:block th:if="${v.listing.firstSeenAt != null}">First seen
            <time th:datetime="${v.listing.firstSeenAt}"
                  th:title="${v.listing.firstSeenAt}"
                  data-fmt="relative"
                  th:text="${v.listing.firstSeenAt}"></time>
          </th:block>
        </span>
        <!-- One tap to the location. The plain maps.google URL opens the Google Maps app on a
             phone and the website on a laptop. The title already carries ", city", so it is a
             complete address on its own. -->
        <a class="lc-map" target="_blank" rel="noopener"
           th:href="'https://www.google.com/maps/search/?api=1&amp;query=' + ${#uris.escapeQueryParam(v.listing.title)}"
           aria-label="Open location in Google Maps">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        </a>
      </div>
    </article>
  </body>
</html>
