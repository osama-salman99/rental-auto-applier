<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REBO</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header th:replace="~{fragments/header :: appHeader}"></header>
    <main class="container">
      <h1>Dashboard</h1>

      <div th:if="${success}" class="rz-card" role="status"
           style="margin-bottom:1rem; border-left:3px solid var(--rz-ok);" th:text="${success}"></div>
      <div th:if="${error}" class="rz-card" role="alert"
           style="margin-bottom:1rem; border-left:3px solid var(--rz-bad);" th:text="${error}"></div>

      <!-- Agent status, as chips + a count strip — the same visual language as the other consoles. -->
      <div class="chip-row">
        <span th:if="${agent.armedLive()}" class="chip ok chip-dot">Armed</span>
        <span th:if="${agent.enabled and agent.dryRun}" class="chip warn">Dry run</span>
        <span th:if="${!agent.enabled}" class="chip bad">Off</span>
        <span class="chip"
              th:text="${agent.targetCity != null and !agent.targetCity.isBlank()} ? 'Watching ' + ${agent.targetCity} : 'All cities'">Watching Amsterdam</span>
      </div>

      <div class="rz-strip" style="margin-top:1rem;">
        <div><span class="v" th:text="${agent.registered}">0</span><span class="l">Interest registered</span></div>
        <div><span class="v" th:text="${agent.openInScope}">0</span><span class="l">Open in scope</span></div>
        <div><span class="v" th:text="${agent.total}">0</span><span class="l">Listings tracked</span></div>
      </div>

      <p class="rz-section-label">Recent listings</p>

      <p th:if="${#lists.isEmpty(listings)}" class="rz-card"
         style="text-align:center; color: var(--pico-muted-color);">
        No listings yet. The crawler will fill this in on its next pass.
      </p>

      <div class="listing-list">
        <!-- One home. Same card the other three consoles use, so the whole set reads alike. -->
        <article class="rz-card listing-card" th:each="listing : ${listings}"
                 th:classappend="${listing.applied} ? 'applied' : ''">
          <div class="lc-head">
            <a class="lc-title" th:href="'https://www.rebogroep.nl' + ${listing.slug}"
               target="_blank" rel="noopener" th:text="${listing.title}">Address</a>
            <span class="badge" th:classappend="'badge-' + ${listing.stage}" th:text="${listing.stage}">available</span>
          </div>

          <div class="lc-sub">
            <span class="price" th:if="${listing.price != null}" th:text="'€' + ${listing.price}"></span>
            <span th:if="${listing.livingArea != null}" th:text="${listing.livingArea} + ' m²'"></span>
            <span th:if="${listing.bedrooms != null}"
                  th:text="${listing.bedrooms} + (${listing.bedrooms} == 1 ? ' bed' : ' beds')"></span>
            <span th:if="${listing.city != null}" th:text="${listing.city}"></span>
            <span class="lc-match" th:if="${matchingIds.contains(listing.id)}">IN FILTER</span>
          </div>

          <!-- Manual "we registered interest" mark. Posts via the shared applied-toggle handler,
               which now dims the card as well as any table row. -->
          <label class="lc-interest">
            <input type="checkbox" th:checked="${listing.applied}"
                   th:attr="data-listing-id=${listing.id}" class="applied-toggle"
                   role="switch" aria-label="Mark interest registered" />
            Interest registered
          </label>

          <div class="lc-foot">
            <span th:if="${listing.firstSeenAt != null}">Seen
              <time th:datetime="${listing.firstSeenAt}" th:title="${listing.firstSeenAt}"
                    data-fmt="relative" th:text="${listing.firstSeenAt}"></time>
            </span>
            <a class="lc-map" target="_blank" rel="noopener"
               th:href="'https://www.google.com/maps/search/?api=1&amp;query=' + ${#uris.escapeQueryParam(listing.title + ' ' + listing.city)}"
               aria-label="Open location in Google Maps">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
            </a>
          </div>
        </article>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
